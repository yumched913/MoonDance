<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>달춤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=East+Sea+Dokdo&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0a1028; overflow: hidden; }
  canvas { display: block; }
  #title {
    position: fixed; left: 16px; top: calc(14px + env(safe-area-inset-top, 0px));
    text-align: left; color: #e4d9ff; font-family: "East Sea Dokdo", "Nanum Brush Script", cursive;
    font-size: 38px; line-height: 1.1; letter-spacing: .06em; text-shadow: 0 0 14px rgba(160,140,255,.85), 0 0 3px rgba(255,255,255,.6);
    pointer-events: none;
  }
  #sound {
    position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); right: 14px;
    padding: 10px 16px; border: 1px solid rgba(255,220,150,.5); border-radius: 999px;
    background: rgba(20,24,50,.7); color: #ffe9b8; font-size: 15px; cursor: pointer;
    font-family: "Noto Sans KR", "Malgun Gothic", sans-serif;
  }
  #hint { position: fixed; left: 16px; top: calc(66px + env(safe-area-inset-top, 0px)); color: #cfd8ff; font-size: 13px;
    font-family: "Noto Sans KR", "Malgun Gothic", sans-serif; opacity: .85; transition: opacity 1s; pointer-events: none; max-width: 60vw; line-height: 1.5; }
  #stick { position: fixed; left: calc(22px + env(safe-area-inset-left, 0px)); bottom: calc(30px + env(safe-area-inset-bottom, 0px));
    width: 120px; height: 120px; border-radius: 50%; background: rgba(255,235,190,.12); border: 1px solid rgba(255,220,150,.45);
    touch-action: none; display: none; }
  .touch #stick { display: block; }
  #knob { position: absolute; left: 35px; top: 35px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,225,160,.6); pointer-events: none; }
  #acts { position: fixed; left: 0; top: 0; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; will-change: transform; }
  #acts button { padding: 10px 16px; border: 1px solid rgba(255,220,150,.6); border-radius: 999px; background: rgba(40,34,60,.82);
    color: #ffe9b8; font-size: 15px; cursor: pointer; font-family: "Noto Sans KR", "Malgun Gothic", sans-serif; }
  #acts button[hidden] { display: none; }
  #acts button:focus-visible { outline: 2px solid #ffd98a; outline-offset: 2px; }
  #cheer { position: fixed; top: 28%; left: 50%; transform: translateX(-50%); font-size: 34px; color: #ffe9b8; opacity: 0;
    transition: opacity .35s; pointer-events: none; text-shadow: 0 0 14px rgba(255,200,120,.8); font-family: "Noto Sans KR", sans-serif; white-space: pre-line; text-align: center; line-height: 1.35; }
  #cheer.show { opacity: 1; }
  #musicBtn { position: fixed; top: calc(62px + env(safe-area-inset-top, 0px)); right: 14px; padding: 8px 14px; border: 1px solid rgba(255,220,150,.5);
    border-radius: 999px; background: rgba(20,24,50,.7); color: #ffe9b8; font-size: 14px; cursor: pointer; font-family: "Noto Sans KR", "Malgun Gothic", sans-serif; }
  #musicPanel { position: fixed; top: calc(154px + env(safe-area-inset-top, 0px)); right: 14px; width: 250px; max-width: calc(100vw - 28px); box-sizing: border-box; padding: 12px;
    border-radius: 14px; background: rgba(20,24,50,.93); border: 1px solid rgba(255,220,150,.4); color: #ffe9b8; font-size: 13px; line-height: 1.5;
    font-family: "Noto Sans KR", "Malgun Gothic", sans-serif; display: none; }
  #musicPanel.open { display: block; }
  #musicPanel input[type=text] { width: 100%; box-sizing: border-box; padding: 9px; border-radius: 8px; border: 1px solid #6a6f9a; background: #0f1330; color: #fff; font-size: 14px; margin-top: 6px; }
  #musicPanel .row { display: flex; gap: 6px; margin-top: 8px; }
  #musicPanel button { flex: 1; padding: 9px 6px; border-radius: 8px; border: 1px solid rgba(255,220,150,.5); background: rgba(60,50,90,.9); color: #ffe9b8; font-size: 13px; cursor: pointer; }
  #musicPanel input[type=range] { width: 100%; margin-top: 8px; }
  #ytbox { margin-top: 8px; width: 220px; height: 124px; display: none; }
  #ytbox.on { display: block; }
  #musicMsg { margin-top: 6px; color: #ffb4b4; min-height: 1em; }
  #friendBtn { position: fixed; top: calc(110px + env(safe-area-inset-top, 0px)); right: 14px; padding: 8px 14px; border: 1px solid rgba(255,220,150,.5);
    border-radius: 999px; background: rgba(20,24,50,.7); color: #ffe9b8; font-size: 14px; cursor: pointer; font-family: "Noto Sans KR", "Malgun Gothic", sans-serif; }
  #friendPanel { position: fixed; top: calc(154px + env(safe-area-inset-top, 0px)); right: 14px; width: 250px; max-width: calc(100vw - 28px); box-sizing: border-box; padding: 12px;
    border-radius: 14px; background: rgba(20,24,50,.93); border: 1px solid rgba(255,220,150,.4); color: #ffe9b8; font-size: 13px; line-height: 1.5;
    font-family: "Noto Sans KR", "Malgun Gothic", sans-serif; display: none; }
  #friendPanel.open { display: block; }
  #friendPanel input { width: 100%; box-sizing: border-box; padding: 9px; border-radius: 8px; border: 1px solid #6a6f9a; background: #0f1330; color: #fff; font-size: 14px; margin-top: 6px; }
  #friendPanel .row { display: flex; gap: 6px; margin-top: 8px; }
  #friendPanel button { flex: 1; padding: 9px 6px; border-radius: 8px; border: 1px solid rgba(255,220,150,.5); background: rgba(60,50,90,.9); color: #ffe9b8; font-size: 13px; cursor: pointer; }
  #friendPanel button[hidden] { display: none; }
  #friendMsg { margin-top: 6px; color: #ffd0d0; min-height: 1em; }
  #online { position: fixed; left: 50%; transform: translateX(-50%); top: calc(18px + env(safe-area-inset-top, 0px)); padding: 5px 14px; border-radius: 999px;
    background: rgba(20,24,50,.7); color: #cfe0ff; font-size: 14px; font-family: "Noto Sans KR", "Malgun Gothic", sans-serif; pointer-events: none; }
  #friendBtn:focus-visible, #friendPanel button:focus-visible { outline: 2px solid #ffd98a; outline-offset: 2px; }
  #musicBtn:focus-visible, #musicPanel button:focus-visible { outline: 2px solid #ffd98a; outline-offset: 2px; }
  #sound:focus-visible { outline: 2px solid #ffd98a; outline-offset: 2px; }
</style>
</head>
<body>
<div id="title">달춤</div>
<button id="sound" type="button">🔇 소리 켜기</button>
<button id="musicBtn" type="button">🎼 음악 바꾸기</button>
<div id="musicPanel">
  유튜브 링크를 붙여넣고 <b>틀기</b>를 눌러 주세요.
  <input id="ytLink" type="text" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off" inputmode="url">
  <div class="row"><button id="ytPlay" type="button">▶ 틀기</button><button id="ytStop" type="button">기본 음악으로</button></div>
  <input id="ytVol" type="range" min="0" max="100" value="60" aria-label="음악 크기">
  <div id="musicMsg"></div>
  <div id="ytbox"><div id="ytplayer"></div></div>
</div>
<div id="online">혼자 모드</div>
<button id="friendBtn" type="button">👥 친구랑 만나기</button>
<div id="friendPanel">
  같은 <b>방 이름</b>으로 들어오면 서로 보여요.<br>닉네임은 자동으로 정해져요.
  <input id="roomIn" type="text" placeholder="방 이름 (예: 우리방)" maxlength="30" autocomplete="off">
  <div class="row"><button id="joinBtn" type="button">입장</button><button id="leaveBtn" type="button" hidden>나가기</button></div>
  <div id="friendMsg"></div>
</div>
<div id="hint"></div>
<div id="cheer">🥂 짠!</div>
<div id="stick"><div id="knob"></div></div>
<div id="acts">
  <button id="actSit" type="button" hidden>앉기</button>
  <button id="actCoffee" type="button" hidden>커피 받기 ☕</button>
  <button id="actDrink" type="button" hidden>마시기 ☕</button>
  <button id="actToast" type="button" hidden>건배 🥂</button>
</div>

  var MP = { on: false, client: null, ch: null, id: 'u' + Math.random().toString(36).slice(2, 10), name: '나', room: '', remotes: {}, sendT: 0, lastKey: '' };
  var nearRemoteId = null, myLabel = { sp: null };
  var NICKS = ['새벽별', '리그렛', '럽이댄', '백투유', '하이불리', '콜미', '촛불', '여정', '웰엠아', '블루', '하이라이트', '얼라이브', '다이브', '스탠업', '야경', '반딧불이', '셧다운', '베스나', '어딕션', '라데', '다이너마이트', '겟백', '루비', '카세트테이프', '눈덩이', '달춤', '터널', '폴린엔젤', '이 별', '미아', '영혼의밤', '시부야스크램블', '라이어', '딴따라', '스바마사', '얼론', '세이브미', '앳홈'];
  var mpConfigured = SUPABASE_URL.indexOf('http') === 0 && SUPABASE_KEY.length > 20;
  if (!mpConfigured) { document.getElementById('friendBtn').hidden = true; document.getElementById('online').hidden = true; }   // 친구 연결 설정 전에는 버튼을 숨김(혼자 쓰는 사이트)
  var onlineEl = document.getElementById('online'), friendPanel = document.getElementById('friendPanel'), friendMsg = document.getElementById('friendMsg');
  var roomIn = document.getElementById('roomIn'), joinBtn = document.getElementById('joinBtn'), leaveBtn = document.getElementById('leaveBtn');
  function fmsg(t) { friendMsg.textContent = t || ''; }
  try { roomIn.value = localStorage.getItem('rooftopRoom') || ''; } catch (e) {}
  document.getElementById('friendBtn').addEventListener('click', function () { musicPanel.classList.remove('open'); friendPanel.classList.toggle('open'); });

  // 글자 말풍선/이름표 (캔버스로 그려서 머리 위에 띄움)
  function textSprite(text, fs, bg, fg, maxW) {
    var c = document.createElement('canvas'), x = c.getContext('2d'), font = fs + 'px "Noto Sans KR", "Malgun Gothic", sans-serif';
    x.font = font; var w = Math.min(maxW, Math.ceil(x.measureText(text).width) + 36), h = fs + 24;
    c.width = w; c.height = h; x = c.getContext('2d'); x.font = font; x.textAlign = 'center'; x.textBaseline = 'middle';
    var r = h / 2; x.fillStyle = bg; x.beginPath(); x.moveTo(r, 0); x.lineTo(w - r, 0); x.quadraticCurveTo(w, 0, w, r); x.quadraticCurveTo(w, h, w - r, h);
    x.lineTo(r, h); x.quadraticCurveTo(0, h, 0, r); x.quadraticCurveTo(0, 0, r, 0); x.fill();
    x.fillStyle = fg; x.fillText(text, w / 2, h / 2 + 1);
    var sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthTest: false }));
    sp.scale.set(w / 110, h / 110, 1); sp.renderOrder = 20; return sp;
  }
  function setText(g, store, text, y, fs, bg, fg, maxW) {
    if (store.sp) { g.remove(store.sp); store.sp.material.map.dispose(); store.sp.material.dispose(); store.sp = null; }
    if (!text) return;
    store.sp = textSprite(text, fs, bg, fg, maxW); store.sp.position.set(0, y, 0); g.add(store.sp);
  }
  function setName(g, store, name) { setText(g, store, name, 2.2, 26, 'rgba(20,24,50,0.8)', '#ffe9b8', 300); }

  function hashStr(s) { var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return Math.abs(h); }
  function makeRemote(id, name) {
    var pal = [[0xd9824b, 0xc4733f], [0x6a8fd0, 0x5b7fc0], [0x7a5aa8, 0x6a4a98], [0x3f7a6a, 0x2f6a5a], [0xc96a8a, 0xb95a7a], [0x8a8a3a, 0x7a7a2a]][hashStr(id) % 6];
    var g = person(0, 0, 0, pal[0], pal[1], 'band', 'hair'); g.visible = false;
    var r = { g: g, name: name || '손님', nm: { sp: null }, tx: 0, tz: 0, tr: 0, seat: -1, first: true, ph: 0, cheer: 0 };
    setName(g, r.nm, r.name); return r;
  }
  function freeSeat(id) { SEATS.forEach(function (s) { if (s.by === id) { s.busy = false; s.by = null; } }); }
  function removeRemote(id) {
    var r = MP.remotes[id]; if (!r) return;
    freeSeat(id); scene.remove(r.g); delete MP.remotes[id];
  }
  function onState(p) {
    if (!p || p.id === MP.id || typeof p.id !== 'string') return;
    if (!isFinite(p.x) || !isFinite(p.z) || !isFinite(p.ry)) return;
    var r = MP.remotes[p.id] || (MP.remotes[p.id] = makeRemote(p.id, p.name));
    var nm = String(p.name || '손님').slice(0, 10);
    if (nm !== r.name) { r.name = nm; setName(r.g, r.nm, nm); }
    r.tx = Math.max(-6.5, Math.min(6.5, +p.x)); r.tz = Math.max(-4.6, Math.min(4.6, +p.z)); r.tr = +p.ry;
    var idx = (p.seat | 0) >= 0 && SEATS[p.seat | 0] ? (p.seat | 0) : -1;
    if (idx !== r.seat) { freeSeat(p.id); if (idx >= 0 && !SEATS[idx].busy) { SEATS[idx].busy = true; SEATS[idx].by = p.id; } r.seat = idx; }
    r.g.visible = true;
  }
  function onToast(p) {
    if (!p) return;
    var r = MP.remotes[p.id]; if (r) r.cheer = 1.4;
    if (p.to === MP.id) {
      if (P.cheer <= 0 && !P.anim) {
        P.cheer = 1.4; P.target = null; P.sitTarget = null; marker.visible = false;
        if (r && !P.seat) me.rotation.y = Math.atan2(r.g.position.x - me.position.x, r.g.position.z - me.position.z);
        cheerEl.textContent = '🥂 짠!'; cheerEl.style.fontSize = ''; cheerEl.classList.add('show'); setTimeout(clink, 500); setTimeout(function () { cheerEl.classList.remove('show'); }, 1500);
      }
    } else if (p.to && MP.remotes[p.to]) { MP.remotes[p.to].cheer = 1.4; }
  }
  function curState() {
    return { id: MP.id, name: MP.name, x: +me.position.x.toFixed(2), z: +me.position.z.toFixed(2), ry: +me.rotation.y.toFixed(2),
             seat: P.seat ? SEATS.indexOf(P.seat) : -1, mv: P.moving ? 1 : 0 };
  }
  function sendState() {
    if (!MP.on) return;
    var st = curState(); MP.lastKey = [st.x, st.z, st.ry, st.seat, st.mv, st.name].join('|'); MP.sendT = 0;
    try { MP.ch.send({ type: 'broadcast', event: 'st', payload: st }); } catch (e) {}
  }
  function roomTopic(room) { return 'rooftop-' + room.split('').map(function (c) { return ('0000' + c.charCodeAt(0).toString(36)).slice(-4); }).join(''); }
  function onSync() {
    var ids = Object.keys(MP.ch.presenceState());
    onlineEl.textContent = '접속 ' + Math.max(1, ids.length) + '명';
    Object.keys(MP.remotes).forEach(function (id) { if (ids.indexOf(id) < 0) removeRemote(id); });
  }
  function mpLeave(silent) {
    if (MP.client && MP.ch) { try { MP.client.removeChannel(MP.ch); } catch (e) {} }
    Object.keys(MP.remotes).forEach(removeRemote);
    MP.on = false; MP.ch = null; MP.client = null;
    setText(me, myLabel, '', 0, 26, '', '', 0);
    onlineEl.textContent = '혼자 모드'; leaveBtn.hidden = true; joinBtn.hidden = false; roomIn.disabled = false;
    if (!silent) fmsg('나왔어요. 혼자 모드예요.');
  }
  function mpJoin(room) {
    if (!window.supabase) { fmsg('친구 연결 도구를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.'); return; }
    fmsg('연결하는 중...'); MP.room = room; joinBtn.disabled = true;
    try {
      MP.client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { realtime: { params: { eventsPerSecond: 20 } } });
      MP.ch = MP.client.channel(roomTopic(room), { config: { presence: { key: MP.id }, broadcast: { self: false } } });
      MP.ch.on('presence', { event: 'sync' }, onSync)
        .on('presence', { event: 'join' }, function (e) { if (e.key !== MP.id) sendState(); })
        .on('broadcast', { event: 'st' }, function (m) { onState(m.payload); })
        .on('broadcast', { event: 'toast' }, function (m) { onToast(m.payload); })
        .subscribe(function (status) {
          joinBtn.disabled = false;
          if (status === 'SUBSCRIBED') {
            var taken = [], ps = MP.ch.presenceState();   // 이미 방에 있는 친구들이 쓰는 닉네임은 피해서 뽑음
            Object.keys(ps).forEach(function (k) { (ps[k] || []).forEach(function (m) { if (m && m.name) taken.push(m.name); }); });
            var pool = NICKS.filter(function (n) { return taken.indexOf(n) < 0; });
            MP.name = pool.length ? pool[Math.floor(Math.random() * pool.length)] : NICKS[Math.floor(Math.random() * NICKS.length)] + (1 + Math.floor(Math.random() * 99));
            MP.on = true; MP.ch.track({ name: MP.name });
            joinBtn.hidden = true; leaveBtn.hidden = false; roomIn.disabled = true;
            setName(me, myLabel, MP.name); fmsg('들어왔어요! 내 닉네임은 "' + MP.name + '"이에요.'); sendState();
          } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
            fmsg('연결하지 못했어요. 인터넷을 확인하거나, Supabase의 Realtime 설정(Allow public access)을 확인해 주세요.'); mpLeave(true);
          }
        });
    } catch (e) { joinBtn.disabled = false; fmsg('연결 중 문제가 생겼어요. 설정값을 확인해 주세요.'); }
  }
  joinBtn.addEventListener('click', function () {
    var room = roomIn.value.trim().toLowerCase().replace(/\s+/g, '-').slice(0, 30);
    if (!room) { fmsg('방 이름을 적어 주세요.'); return; }
    if (!mpConfigured) { fmsg('아직 친구 연결 설정 전이에요. 설정이 끝나면 여기서 친구랑 만날 수 있어요.'); return; }
    try { localStorage.setItem('rooftopRoom', roomIn.value.trim()); } catch (e) {}
    mpJoin(room);
  });
  leaveBtn.addEventListener('click', function () { mpLeave(false); });
  function mpUpdate(dt, t) {
    if (!MP.on) { nearRemoteId = null; return; }
    MP.sendT += dt;
    var st = curState(), key = [st.x, st.z, st.ry, st.seat, st.mv, st.name].join('|');
    if ((key !== MP.lastKey && MP.sendT > 0.1) || MP.sendT > 1.5) sendState();
    var best = null, bd = 2.6;
    Object.keys(MP.remotes).forEach(function (id) {
      var r = MP.remotes[id], g = r.g; if (!g.visible) return;
      var S = r.seat >= 0 ? SEATS[r.seat] : null, tx = S ? S.x : r.tx, tz = S ? S.z : r.tz, tr = S ? S.ry : r.tr, ox = g.position.x, oz = g.position.z;
      if (r.first) { g.position.set(tx, (S && S.y) || 0, tz); g.rotation.y = tr; r.first = false; }
      else {
        var k = 1 - Math.exp(-dt * 9); g.position.x += (tx - ox) * k; g.position.z += (tz - oz) * k;
        g.rotation.y += Math.atan2(Math.sin(tr - g.rotation.y), Math.cos(tr - g.rotation.y)) * k;
        g.position.y += (((S && S.y) || 0) - g.position.y) * k;
      }
      var u = g.userData, moved = Math.hypot(g.position.x - ox, g.position.z - oz) / Math.max(dt, 0.001), wk = !S && moved > 0.3;
      u.legsSit.visible = !!S; u.legsStand.visible = !S;
      if (wk) r.ph += dt * 9; var sw = wk ? Math.sin(r.ph) : 0;
      u.legs[0].rotation.x = sw * 0.7; u.legs[1].rotation.x = -sw * 0.7; u.armO.rotation.x = -sw * 0.5; u.armC.rotation.x = sw * 0.5;
      if (r.cheer > 0) { r.cheer -= dt; var kk = Math.sin(Math.max(0, 1 - r.cheer / 1.4) * Math.PI); u.armC.rotation.x = -2.0 * kk; u.glass.visible = true; u.glass.rotation.x = -u.armC.rotation.x; }
      else u.glass.visible = false;
      var d = Math.hypot(g.position.x - me.position.x, g.position.z - me.position.z); if (d < bd) { bd = d; best = id; }
    });
    nearRemoteId = best;
  }


  // ---- 유튜브 링크로 음악 틀기 ----
  var ytActive = false, ytPlayer = null, ytSingle = false, ytPending = null;
  var musicPanel = document.getElementById('musicPanel'), musicMsg = document.getElementById('musicMsg'), ytBox = document.getElementById('ytbox');
  var ytLink = document.getElementById('ytLink'), ytVol = document.getElementById('ytVol');
  document.getElementById('musicBtn').addEventListener('click', function () { document.getElementById('friendPanel').classList.remove('open'); musicPanel.classList.toggle('open'); });
  function say(t) { musicMsg.textContent = t || ''; }
  function parseYT(u) {
    var id = null, list = null;
    try {
      var url = new URL(/^https?:/i.test(u.trim()) ? u.trim() : 'https://' + u.trim());
      var h = url.hostname.replace(/^(www|m)\./, '');
      if (h === 'youtu.be') id = url.pathname.slice(1).split('/')[0];
      else if (/(^|\.)youtube\.com$/.test(h)) {
        id = url.searchParams.get('v');
        if (!id) { var m = url.pathname.match(/\/(embed|shorts|live)\/([\w-]{11})/); if (m) id = m[2]; }
        list = url.searchParams.get('list');
      }
    } catch (e) {}
    if (id && !/^[\w-]{11}$/.test(id)) id = null;
    return { id: id, list: list };
  }
  function loadYT(cb) {
    if (window.YT && YT.Player) { cb(); return; }
    ytPending = cb;
    if (document.getElementById('ytapi')) return;
    var sc = document.createElement('script'); sc.id = 'ytapi'; sc.src = 'https://www.youtube.com/iframe_api';
    sc.onerror = function () { say('유튜브를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.'); document.head.removeChild(sc); };
    document.head.appendChild(sc);
  }
  window.onYouTubeIframeAPIReady = function () { if (ytPending) { var f = ytPending; ytPending = null; f(); } };
  function stopBuiltin() { clearTimeout(chimeTimer); if (songG && ac) songG.gain.setTargetAtTime(0, ac.currentTime, 0.2); }
  function startYT(p) {
    ytSingle = !p.list; ytActive = true; stopBuiltin(); ytBox.classList.add('on');
    if (!ytPlayer) {
      var pv = { autoplay: 1, playsinline: 1, rel: 0 };
      if (p.list) { pv.listType = 'playlist'; pv.list = p.list; }
      ytPlayer = new YT.Player('ytplayer', {
        width: 220, height: 124, videoId: p.list ? undefined : p.id, playerVars: pv,
        events: {
          onReady: function (e) { e.target.setVolume(+ytVol.value); if (p.list) e.target.setLoop(true); e.target.playVideo(); say(''); },
          onStateChange: function (e) { if (e.data === YT.PlayerState.ENDED && ytSingle) { e.target.seekTo(0); e.target.playVideo(); } },
          onError: function () { say('이 영상은 재생할 수 없어요. (퍼가기가 막혀 있을 수 있어요.) 다른 링크를 넣어 보세요.'); }
        }
      });
    } else {
      if (p.list) { ytPlayer.loadPlaylist({ listType: 'playlist', list: p.list }); ytPlayer.setLoop(true); } else ytPlayer.loadVideoById(p.id);
      ytPlayer.setVolume(+ytVol.value); say('');
    }
  }
  document.getElementById('ytPlay').addEventListener('click', function () {
    var p = parseYT(ytLink.value);
    if (!p.id && !p.list) { say('올바른 유튜브 링크가 아니에요. 주소를 통째로 복사해서 붙여넣어 주세요.'); return; }
    say('불러오는 중...'); loadYT(function () { startYT(p); });
  });
  document.getElementById('ytStop').addEventListener('click', function () {
    if (ytPlayer) ytPlayer.stopVideo();
    ytActive = false; ytBox.classList.remove('on'); say('');
    if (soundOn && ac) { clearTimeout(chimeTimer); chimeTimer = setTimeout(chime, 800); }
  });
  ytVol.addEventListener('input', function () { if (ytPlayer && ytPlayer.setVolume) ytPlayer.setVolume(+ytVol.value); });


  tick();
  addEventListener('resize', function () {
    camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
})();
</script>
